name: Update Markdown JSONs

on:
  push:
    paths:
      - 'dto/*.json'
      - 'docs/*.md'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up jq
        run: sudo apt-get install -y jq

      - name: Make script executable
        run: chmod +x ./update_json_in_markdown.sh

      - name: Inject JSON into Markdown
        run: ./update_json_in_markdown.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.md
          git commit -m "Update embedded JSON in Markdown" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
