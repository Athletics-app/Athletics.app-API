name: Update Markdown JSONs
on:
  push:
    paths:
      - 'dto/**/*.json'
      - 'docs/**/*.md'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update script
        run: python3 update-api-docs.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/**/*.md
          git commit -m "Update embedded JSON in Markdown" || echo "No changes to commit"
          git push