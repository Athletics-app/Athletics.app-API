<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device‑width, initial‑scale=1" />
    <title>Athletics.app API Reference (Scalar)</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Load Scalar JS -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

    <script>
      Scalar.createApiReference('#app', {
        // URL naar jouw OpenAPI spec
        url: './openapi.yaml',
        // Proxy indien nodig voor CORS
        proxyUrl: 'https://athletics-app.github.io/Athletics.app-API/openapi.yaml'
      });
    </script>
  </body>
</html>
